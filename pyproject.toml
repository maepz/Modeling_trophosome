[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trophosome-model"
version = "0.5.0"
description = "Population-genetic models for horizontally acquired tubeworm symbionts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
coalescent = [
  "msprime>=1.3,<2",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "tskit>=0.5,<2",
]
plot = ["matplotlib>=3.8,<4"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
trophosome = "trophosome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/benchmark_v1_3_vs_exact.py" = ["B023", "E731"]
"src/trophosome/simulation.py" = ["B023"]
