model = "wright_fisher_counts"
seed = 666
replicates = 1

[environment]
initial_counts = [5000, 3000, 1500, 500]
initial_within_host_fitness = [1.0, 0.99, 1.01, 0.98]
initial_free_living_fitness = [0.98, 1.01, 0.99, 1.0]
sampling_mode = "reservoir"
capacity_ratio = 1.0

[host]
population_size = 3
infection_bottleneck = 5
carrying_capacity = 100
growth_factor = 1.5
steady_generations = 3
host_generations = 2
escape_fraction = 0.01

[evolution]
mutation_probability = 0.0001
mutation_effect_mean = -0.01
mutation_effect_sd = 0.01
within_host_selection = true
free_living_selection = false
fitness_floor = 0.0
max_materialized_mutants = 10000

[output]
snapshot_interval = 5
checkpoint_interval = "1h"
checkpoint_keep = 2
retain_host_histories = false
host_counts_mode = "summary"
host_panel_size = 3

[execution]
workers = 1
host_batch_size = 2
in_flight_batches_per_worker = 2
